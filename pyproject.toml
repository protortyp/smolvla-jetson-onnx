[project]
name = "smolvla-jetson-onnx"
version = "0.1.0"
description = "Static-shape ONNX export and zero-copy I/O-Binding runner for SmolVLA on Jetson and CUDA"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface_hub>=0.28.0",
    "numpy>=2.0.0",
    "onnx>=1.17.0",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime>=1.20.0",
]
cuda = [
    "onnxruntime-gpu>=1.20.0",
]
export = [
    "lerobot>=0.7.0",
    "onnxscript>=0.5.0",
    "psutil>=6.0.0",
    "safetensors>=0.4.5",
    "torch>=2.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
smolvla-onnx-infer = "smolvla_onnx.infer_io_binding:main"
smolvla-onnx-export = "smolvla_onnx.export_smolvla_onnx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smolvla_onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
